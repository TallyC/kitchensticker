<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>廚房工具｜A4 標籤製作</title><style>
:root{--ink:#24332d;--green:#385447;--gold:#c5a75b;--paper:#f4f0e3;--line:#c8c8b9;--white:#fffdf8}*{box-sizing:border-box}body{margin:0;background:#e8e8df;color:var(--ink);font:16px/1.5 system-ui,"Noto Sans TC",sans-serif}.app{max-width:1440px;margin:auto;padding:20px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:16px}.eyebrow{color:#b97a50;font-size:.8rem;letter-spacing:.12em}.hero h1{font:500 clamp(1.7rem,4vw,2.7rem)/1.2 Georgia,"Noto Serif TC",serif;margin:.25rem 0}.hero p{margin:0;color:#667168}.btn{display:inline-block;text-decoration:none;border:1px solid var(--green);background:var(--green);color:#fff;padding:9px 13px;border-radius:8px;font:inherit;cursor:pointer}.btn.light{background:var(--white);color:var(--green);border-color:var(--line)}.layout{display:grid;grid-template-columns:270px minmax(360px,1fr) 290px;gap:14px}.panel,.paper-wrap{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:15px}.panel h2{font-size:1rem;margin:0 0 12px}.field{margin:10px 0}.field label{display:block;color:#667168;font-size:.82rem;margin-bottom:4px}.field input,.field select{width:100%;padding:8px;border:1px solid var(--line);border-radius:7px;background:#fff;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.library{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:600px;overflow:auto}.tool{border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px;text-align:left;cursor:pointer}.tool img{width:100%;height:84px;object-fit:contain;background:var(--paper)}.catalog-placeholder{height:84px;display:grid;place-items:center;background:var(--paper);color:#7b857b;font-size:.75rem}.library-actions{display:flex;align-items:center;gap:8px;margin:8px 0}.library-actions .note{margin:0;font-size:.75rem}.import-btn{cursor:pointer}.tool b{display:block;font-size:.78rem;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.paper-wrap{background:#d8d9d1;display:grid;place-items:center;min-height:650px}.paper{width:min(100%,570px);aspect-ratio:210/297;background:#fff;padding:5%;box-shadow:0 14px 28px #24332d22;display:grid;gap:3%;position:relative}.paper.landscape{aspect-ratio:297/210;width:min(100%,760px)}.cell{background:var(--paper);border:1px dashed #b8bbae;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;overflow:hidden;padding:5%;cursor:pointer;position:relative}.cell.selected{outline:3px solid var(--green);outline-offset:2px}.cell img{max-width:88%;max-height:68%;object-fit:contain}.cell strong{font-weight:650;text-align:center;line-height:1.15;overflow-wrap:anywhere}.cell small{color:#667168;text-align:center;margin-top:3px}.empty{color:#8a9185;font-size:.8rem;text-align:center}.note{color:#667168;font-size:.82rem;margin:8px 0}.status{position:fixed;right:16px;bottom:16px;background:var(--green);color:#fff;padding:9px 13px;border-radius:8px;display:none}.status.show{display:block}@media(max-width:1050px){.layout{grid-template-columns:240px 1fr}.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:14px}}@media(max-width:700px){.app{padding:12px}.hero{display:block}.hero .btn{margin-top:10px}.layout{display:flex;flex-direction:column}.paper-wrap{min-height:450px}.right{display:block}.library{grid-template-columns:repeat(3,1fr);max-height:260px}.tool img{height:70px}}@media print{body{background:#fff}.hero,.left,.right{display:none!important}.app,.layout,.paper-wrap{display:block;padding:0;border:0;background:#fff}.paper{width:210mm;height:297mm;padding:12mm;box-shadow:none;gap:5mm}.paper.landscape{width:297mm;height:210mm}@page{size:auto;margin:0}}
</style><style>.color-record{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}.color-record strong{font-size:.8rem;color:var(--green)}#colorHistory{display:flex;flex-wrap:wrap;gap:6px;margin:7px 0}.color-chip{width:28px;height:28px;border:2px solid #fff;outline:1px solid var(--line);border-radius:50%;cursor:pointer}.records{margin-top:14px}.records-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.records h2{font-size:1rem;margin:0}.records p{margin:2px 0;color:#667168;font-size:.8rem}.record-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:10px}.record-card{border:1px solid var(--line);border-radius:9px;padding:8px;background:#fff}.record-card strong,.record-card small{display:block}.record-card strong{font-size:.82rem}.record-card small{color:#667168;font-size:.72rem}.record-card button{margin-top:6px;padding:5px 8px;font-size:.75rem}</style></style></head><body><main class="app"><header class="hero"><div><div class="eyebrow">A4 LABEL LAYOUT</div><h1>廚房工具 A4 標籤製作</h1><p>先決定 A4 排版，再把工具放入格位；選取格位後調整名稱、字體與圖片。</p></div><div><a class="btn light" href="../kitchen-tools/index.html">← 回工作區首頁</a> <button class="btn light" id="png">下載 A4 PNG</button> <button class="btn" id="print">列印／另存 PDF</button></div></header><section class="layout"><aside class="panel left"><h2>1｜選擇 A4 排版</h2><div class="row"><div class="field"><label>紙張方向</label><select id="orientation"><option value="portrait">直式</option><option value="landscape">橫式</option></select></div><div class="field"><label>每頁張數</label><select id="count"><option value="1">1 張</option><option value="2">2 張</option><option value="4">4 張</option><option value="6">6 張</option><option value="8" selected>8 張</option><option value="10">10 張</option></select></div></div><p class="note">A4 紙張與格位是工作起點。點選中央格位後，再加入工具或修改內容。</p><h2>2｜工具圖庫</h2><div class="library-actions"><button class="btn light" id="syncCatalog" type="button">同步工具資料</button><label class="btn light import-btn">匯入工具資料<input id="importCatalog" type="file" accept="application/json,.json" hidden></label></div><span class="note" id="catalogSyncStatus">同網站可同步；本機檔案請匯入插畫工作台下載的 JSON。</span><div class="library" id="library"></div><div class="field"><label>上傳新工具圖片</label><input id="upload" type="file" accept="image/*"></div></aside><section class="paper-wrap"><div class="paper" id="paper"></div></section><aside class="panel right"><h2>3｜編輯選取格位</h2><div id="emptyEdit" class="note">請先點選中央的一個格位。</div><div id="editor" hidden><div class="field"><label>工具名稱</label><input id="name"></div><div class="field"><label>補充文字</label><input id="sub"></div><div class="row"><div class="field"><label>字體</label><select id="font"><option value="serif">明體</option><option value="sans">黑體</option><option value="round">圓體</option></select></div><div class="field"><label>字級</label><input id="size" type="number" min="12" max="72" value="24"></div></div><div class="row"><div class="field"><label>文字顏色</label><input id="color" type="color" value="#24332d"></div><div class="field"><label>底色</label><input id="bg" type="color" value="#f4f0e3"><div class="color-record"><strong>顏色紀錄</strong><div id="colorHistory"></div><button class="btn light" id="copyColor">複製 HEX</button></div></div></div><button class="btn light" id="applyColor">套用底色</button> <button class="btn light" id="clear">清除這個格位</button></div><hr><p class="note">列印前請先確認紙張方向與印表機縮放設定為 100%。</p></aside></section><section class="records panel"><div class="records-head"><div><h2>已組合列印</h2><p>保留這個瀏覽器曾記錄的 A4 組合，方便辨識與複製。</p></div><button class="btn light" id="recordSheet">記錄目前組合</button></div><div class="record-grid" id="recordGrid"><div class="note">尚未記錄組合。</div></div></section><div class="status" id="status" role="status"></div></main><script>
(()=>{const $=id=>document.getElementById(id),fonts={serif:'Georgia,"Noto Serif TC",serif',sans:'system-ui,"Noto Sans TC",sans-serif',round:'"Arial Rounded MT Bold",system-ui,sans-serif'},assets=['量匙.png','白柄菜刀.png','烘焙模具.png','刮刀組.png','削皮器.png','吐司刀.png','廚房剪刀.png','料理盆組.png','網勺.png','量杯組.png','廚房計時器.png','食物溫度計.png','烘焙切模組.png','蒸布.png','竹簾.png','料理夾.png','廚刀組.png','放大鏡.png'];let cells=[],active=0;function toast(t){const s=$('status');s.textContent=t;s.classList.add('show');setTimeout(()=>s.classList.remove('show'),1800)}function renderPaper(){const n=+$('count').value,o=$('orientation').value,p=$('paper');p.className='paper '+o;const cols=o==='landscape'?(n<=2?n:n<=6?3:5):n===1?1:n===2?1:n===4?2:2,rows=Math.ceil(n/cols);p.style.gridTemplateColumns='repeat('+cols+',1fr)';p.style.gridTemplateRows='repeat('+rows+',1fr)';p.innerHTML='';cells=[];for(let i=0;i<n;i++){const c=document.createElement('div');c.className='cell';c.dataset.i=i;c.innerHTML='<div class="empty">'+(i+1)+'<br>選取後加入工具</div>';c.onclick=()=>select(i);p.append(c);cells.push({el:c,data:null})}active=0;select(0)}function select(i){active=i;cells.forEach((x,j)=>x.el.classList.toggle('selected',j===i));const d=cells[i]?.data;if(!d){$('emptyEdit').hidden=false;$('editor').hidden=true}else{ $('emptyEdit').hidden=true;$('editor').hidden=false;['name','sub','font','size','color','bg'].forEach(k=>$(k).value=d[k]);}}function draw(i){const d=cells[i].data,c=cells[i].el;c.style.background=d.bg;c.innerHTML='';const im=document.createElement('img');im.src=d.image;c.append(im);const b=document.createElement('strong');b.textContent=d.name;b.style.fontFamily=fonts[d.font];b.style.fontSize=d.size+'px';b.style.color=d.color;c.append(b);if(d.sub){const s=document.createElement('small');s.textContent=d.sub;s.style.color=d.color;c.append(s)}}function use(image,name){if(!cells[active])return;cells[active].data={image,name,sub:'',font:'serif',size:24,color:'#24332d',bg:'#f4f0e3'};draw(active);select(active);toast('已放入第 '+(active+1)+' 格')}function library(){const root=$('library');assets.forEach(file=>{const b=document.createElement('button');b.className='tool';b.innerHTML='<img src="assets/廚房工具插畫示例/'+file+'"><b>'+file.replace('.png','')+'</b>';b.onclick=()=>use('assets/廚房工具插畫示例/'+file,file.replace('.png',''));root.append(b)})}['orientation','count'].forEach(id=>$(id).onchange=renderPaper);['name','sub','font','size','color','bg'].forEach(id=>$(id).oninput=()=>{if(cells[active]?.data){cells[active].data[id]=$(id).value;draw(active);select(active)}});$('applyColor').onclick=()=>{if(cells[active]?.data){cells[active].data.bg=$('bg').value;draw(active);toast('底色已套用')}};$('clear').onclick=()=>{if(cells[active]){cells[active].data=null;cells[active].el.innerHTML='<div class="empty">'+(active+1)+'<br>選取後加入工具</div>';select(active)}};function exportPng(){const n=+$('count').value,o=$('orientation').value,W=o==='landscape'?3508:2480,H=o==='landscape'?2480:3508,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);const cols=o==='landscape'?(n<=2?n:n<=6?3:5):n===1?1:n===2?1:2,rows=Math.ceil(n/cols),pad=W*.05,gap=W*.018,cw=(W-pad*2-gap*(cols-1))/cols,ch=(H-pad*2-gap*(rows-1))/rows;cells.forEach((v,i)=>{const d=v.data;if(!d)return;const col=i%cols,row=Math.floor(i/cols),cx=pad+col*(cw+gap),cy=pad+row*(ch+gap);x.fillStyle=d.bg;x.fillRect(cx,cy,cw,ch);x.strokeStyle='#b8bbae';x.setLineDash([8,8]);x.strokeRect(cx,cy,cw,ch);x.setLineDash([]);const im=new Image();im.onload=()=>{const sc=Math.min(cw*.82/im.width,ch*.58/im.height);x.drawImage(im,cx+(cw-im.width*sc)/2,cy+ch*.06,im.width*sc,im.height*sc);x.fillStyle=d.color;x.textAlign='center';x.font='600 '+(d.size*300/72)+'px system-ui';x.fillText(d.name,cx+cw/2,cy+ch*.82,cw*.88);if(d.sub){x.font='36px system-ui';x.fillText(d.sub,cx+cw/2,cy+ch*.92,cw*.88)}if(i===cells.length-1){const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='廚房工具_A4.png';a.click()}};im.src=d.image})}$('upload').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>use(r.result,f.name.replace(/\.[^.]+$/,''));r.readAsDataURL(f)};$('png').onclick=exportPng;$('print').onclick=()=>{alert('請在列印視窗選擇「另存為 PDF」或「Save to PDF」。');window.print()};renderPaper();library();window.useKitchenTool=use;window.kitchenCells=cells;})();
</script><script src="../kitchen-label-records.js"></script><script src="../kitchen-catalog-sync.js"></script></body></html>
